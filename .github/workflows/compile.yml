name: Compile

# A full rpmbuild of the patched kwin, for PRs that change what goes into it. `srpm` in ci.yml
# only proves the patch applies; this proves it compiles, so a ported patch is known to build
# before it reaches COPR. About 30-40 minutes, so it runs only when the patch or build changes.

on:
  pull_request:
    paths: ["0001-*.patch", "TAG", "make-srpm.sh", "stable-version.sh", ".github/workflows/compile.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container: registry.fedoraproject.org/fedora:45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: dnf -y -q install --setopt=install_weak_deps=False rpm-build cpio patch xz python3 dnf5-plugins
      - name: Source RPM
        run: ./make-srpm.sh "$(./stable-version.sh)" out
      - run: dnf -y -q builddep out/*.src.rpm
      - name: Build
        run: |
          rpmbuild --rebuild out/*.src.rpm \
            --define "_topdir $RUNNER_TEMP/rpmbuild" \
            --define "_smp_mflags -j$(nproc)" \
            --define "debug_package %{nil}"
          find "$RUNNER_TEMP/rpmbuild/RPMS" -name 'kwin-*.rpm' -print
