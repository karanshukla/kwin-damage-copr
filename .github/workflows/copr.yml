name: Rebuild kwin in COPR

# Every 6 hours: if Fedora's stable kwin has no matching patched build in COPR yet, build one.
# A run fails (and GitHub emails) when the patch stops applying or the COPR build fails.

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["0001-*.patch", "TAG", "make-srpm.sh", ".github/workflows/copr.yml"]

concurrency:
  group: copr-${{ github.ref }}
  cancel-in-progress: false

env:
  PROJECT: kwin-damage

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        fedora: ["45"]
    container: registry.fedoraproject.org/fedora:${{ matrix.fedora }}
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: dnf -y install --setopt=install_weak_deps=False copr-cli rpm-build cpio patch xz curl jq python3

      - name: COPR config
        env:
          COPR_CONFIG: ${{ secrets.COPR_CONFIG }}
        run: |
          test -n "$COPR_CONFIG" || { echo "::error::COPR_CONFIG secret is not set"; exit 1; }
          mkdir -p ~/.config && printf '%s\n' "$COPR_CONFIG" > ~/.config/copr
          echo "OWNER=$(sed -n 's/^username *= *//p' ~/.config/copr)" >> "$GITHUB_ENV"

      - name: What needs building
        id: want
        run: |
          NVR=$(python3 -I latest-stable.py ${{ matrix.fedora }})
          WANT="${NVR#kwin-}.$(cat TAG)"
          echo "Fedora stable: $NVR, want COPR kwin $WANT"
          echo "want=$WANT" >> "$GITHUB_OUTPUT"
          echo "nvr=$NVR" >> "$GITHUB_OUTPUT"
          API=https://copr.fedorainfracloud.org/api_3
          if ! curl -fsS "$API/project?ownername=$OWNER&projectname=$PROJECT" >/dev/null; then
            copr-cli create "$PROJECT" --chroot "fedora-${{ matrix.fedora }}-x86_64" \
              --description "Fedora's kwin with FB_DAMAGE_CLIPS sent for composited frames, so the kernel can do selective update instead of full-frame refresh." \
              --instructions "dnf copr enable $OWNER/$PROJECT, then dnf upgrade kwin kwin-common kwin-libs and log out and back in."
          fi
          STATE=$(curl -fsS "$API/build/list?ownername=$OWNER&projectname=$PROJECT&packagename=kwin&limit=50" 2>/dev/null \
            | jq -r --arg v "$WANT" '[.items[] | select((.source_package.version // "" | sub("^[0-9]+:"; "")) == $v)] | first | .state // "none"')
          echo "existing build of $WANT: $STATE"
          case "$STATE" in
            succeeded|running|pending|starting|importing|waiting) echo "build=no" >> "$GITHUB_OUTPUT" ;;
            failed) echo "::error::the last COPR build of $WANT failed; fix it, then bump TAG or re-run by hand"; \
                    [ "${{ github.event_name }}" = workflow_dispatch ] && echo "build=yes" >> "$GITHUB_OUTPUT" || exit 1 ;;
            *) echo "build=yes" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Source RPM
        if: steps.want.outputs.build == 'yes'
        run: ./make-srpm.sh "${{ steps.want.outputs.nvr }}" out

      - name: COPR build
        if: steps.want.outputs.build == 'yes'
        run: copr-cli build "$OWNER/$PROJECT" --chroot "fedora-${{ matrix.fedora }}-x86_64" out/*.src.rpm
