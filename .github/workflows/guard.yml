name: Guard

# Fails any PR from someone other than the owner that touches what ends up in the package or
# decides how it is built: the patch, TAG, the scripts, CI, or the security policy. `guard` is
# a required check, so such a PR can only merge through the owner's ruleset bypass.
#
# pull_request_target runs THIS file from main, never the PR's copy, so a PR cannot edit the
# guard to pass itself. That trigger is only safe because nothing from the PR is checked out
# or executed: the changed files are read through the API as data.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

jobs:
  guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check who is changing what
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          OWNER: karanshukla
        run: |
          set -euo pipefail
          if [ "$AUTHOR" = "$OWNER" ]; then
            echo "PR by $OWNER; nothing to guard."
            exit 0
          fi

          gh api --paginate "repos/$REPO/pulls/$PR/files" \
            --jq '.[] | [.filename, .status, (.previous_filename // "")] | @tsv' > files.tsv

          # Everything is protected except prose that never reaches the package or the build.
          sensitive() {
            case "$1" in
              README.md) return 1 ;;
              *) return 0 ;;
            esac
          }

          flagged=()
          while IFS=$'\t' read -r name status previous; do
            # A rename is judged on both ends.
            for path in "$name" "$previous"; do
              [ -n "$path" ] || continue
              if sensitive "$path"; then
                flagged+=("$path ($status)")
              fi
            done
          done < files.tsv

          if [ ${#flagged[@]} -eq 0 ]; then
            echo "No protected paths touched by $AUTHOR."
            exit 0
          fi
          {
            echo "## Guard: $OWNER must merge this"
            echo
            echo "\`$AUTHOR\` changed paths that reach the package or its build:"
            echo
            # shellcheck disable=SC2016 # the backticks are markdown
            printf -- '- `%s`\n' "${flagged[@]}"
          } >> "$GITHUB_STEP_SUMMARY"
          printf '::error::%s changed protected path %s\n' "$AUTHOR" "${flagged[@]}"
          exit 1
